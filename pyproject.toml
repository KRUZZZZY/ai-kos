[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-kos"
version = "1.6.0"
description = "AI Knowledge Operating System — self-building knowledge database with auto-linking"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "AI-KOS Team"}]
dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "pyyaml>=6.0",
    "mcp>=1.0",
]

[project.urls]
Homepage = "https://github.com/KRUZZZZY/ai-kos"
Repository = "https://github.com/KRUZZZZY/ai-kos"
Issues = "https://github.com/KRUZZZZY/ai-kos/issues"
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

[project.scripts]
ai-kos = "ai_kos.cli:main"
ai-kos-mcp = "ai_kos.mcp_server:entrypoint"

[project.optional-dependencies]
pdf = ["docling>=2.0", "PyPDF2>=3.0"]
docx = ["docling>=2.0", "python-docx>=1.0"]
semantic = ["sentence-transformers>=3.0", "faiss-cpu>=1.8"]
dev = ["pytest>=8.0", "pytest-cov>=7.0"]

[tool.setuptools.packages.find]
include = ["ai_kos*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
